name: test-action
on: [pull_request, workflow_dispatch]

jobs:
  test-default-latest:
    strategy:
      matrix:
        os: [ubuntu-latest,windows-latest,macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup func CLI
        uses: ./
      - run: func version

  test-custom-version:
    runs-on: ubuntu-latest
    env:
      TEST_VERSION: '1.18.0'
      VERSION_OFFSET: 27  # internal version = minor + offset (v1.19 → v0.46)
    steps:
      - uses: actions/checkout@v4
      - name: Setup func CLI with custom version
        uses: ./
        with:
          version: 'v${{ env.TEST_VERSION }}'
      - name: Verify version
        run: |
          MINOR=$(echo "$TEST_VERSION" | cut -d. -f2)
          INTERNAL=$((MINOR + VERSION_OFFSET))
          func version | grep -q "v0.${INTERNAL}"

  test-nightly-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup func CLI with nightly version
        uses: ./
        with:
          version: 'nightly'
      - run: func version

  test-custom-name:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup func CLI with custom name
        uses: ./
        with:
          name: 'my-func'
      - run: my-func version

  test-custom-destination:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup func CLI with custom destination
        uses: ./
        with:
          destination: '/tmp/func-bin'
      - run: func version
      - name: Verify func using path
        run: /tmp/func-bin/func version

  test-custom-binary-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup func CLI with custom binarySource URL
        uses: ./
        with:
          binarySource: 'https://github.com/knative/func/releases/download/knative-v1.19.0/func_linux_amd64'
      - run: func version

  test-binary-source-tar-gz:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, bin: func_linux_amd64 }
          - { os: macos-latest, bin: func_darwin_arm64 }
          - { os: windows-latest, bin: func_windows_amd64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Pack a func release binary into a tar.gz
        id: pack
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          mkdir bin
          curl -L --fail -o bin/func "https://github.com/knative/func/releases/download/knative-v1.19.0/${{ matrix.bin }}"
          tar -czf func.tar.gz bin/func
          dir="$PWD"
          if [ "$RUNNER_OS" = Windows ]; then dir="/$(cygpath -m "$PWD")"; fi
          echo "url=file://$dir/func.tar.gz" >> "$GITHUB_OUTPUT"
      - name: Setup func CLI from a tar.gz binarySource
        uses: ./
        with:
          binarySource: ${{ steps.pack.outputs.url }}
          binarySubpath: 'bin/func'
      - run: func version

  test-binary-source-tar-gz-errors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack a func release binary into a tar.gz
        working-directory: ${{ runner.temp }}
        run: |
          mkdir bin
          curl -L --fail -o bin/func "https://github.com/knative/func/releases/download/knative-v1.19.0/func_linux_amd64"
          tar -czf func.tar.gz bin/func
      - name: tar.gz without binarySubpath (should fail)
        id: no-subpath
        uses: ./
        with:
          binarySource: 'file://${{ runner.temp }}/func.tar.gz'
          destination: '${{ runner.temp }}/out'
        continue-on-error: true
      - name: binarySubpath naming a directory (should fail)
        id: dir-subpath
        uses: ./
        with:
          binarySource: 'file://${{ runner.temp }}/func.tar.gz'
          binarySubpath: 'bin'
          destination: '${{ runner.temp }}/out'
        continue-on-error: true
      - name: binarySubpath with a plain binary (should fail)
        id: plain-with-subpath
        uses: ./
        with:
          binarySource: 'file://${{ runner.temp }}/bin/func'
          binarySubpath: 'bin/func'
          destination: '${{ runner.temp }}/out'
        continue-on-error: true
      - name: Verify every case failed and left no func behind
        run: |
          for outcome in "${{ steps.no-subpath.outcome }}" "${{ steps.dir-subpath.outcome }}" "${{ steps.plain-with-subpath.outcome }}"; do
            if [ "$outcome" != "failure" ]; then
              echo "Expected every case to fail, got: $outcome"
              exit 1
            fi
          done
          if [ -e "${{ runner.temp }}/out/func" ]; then
            echo "Expected no func at the destination after failed runs"
            exit 1
          fi

  test-invalid-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup func CLI with non-existing version (should fail)
        id: invalid-version
        uses: ./
        with:
          version: 'v99.99.99'
        continue-on-error: true
      - name: Verify action failed
        run: |
          if [ "${{ steps.invalid-version.outcome }}" != "failure" ]; then
            echo "Expected action to fail with invalid version"
            exit 1
          fi
